# Each value can be overridden by an environment variable:
# DB_URL, DB_USER, DB_PASSWORD, BOOKS_DIR
url=jdbc:postgresql://localhost:5432/jee_auth
user=jee_user
password=change_me

# Where the PDF files and covers are stored on disk.
# Use forward slashes, even on Windows (backslashes need escaping in .properties files).
books.dir=C:/jee-auth-data/books
